<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Transcription">
<title>Transcription instantanée</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#777;--bar:#f2f2f7;--accent:#0a63e8;--stop:#e5322d;--lvl:#22a559;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f2f2f2;--muted:#999;--bar:#1c1c1e;--accent:#4d94ff}}
:root[data-theme="dark"]{--bg:#000;--fg:#f2f2f2;--muted:#999;--bar:#1c1c1e;--accent:#4d94ff}
body.hc{--bg:#000;--fg:#ffe600;--muted:#b3a100;--bar:#1a1a1a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--bar)}
select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--muted);border-radius:10px;padding:8px 10px}
header select{flex:1;min-width:0}
#text{flex:1;overflow-y:auto;padding:16px;font-weight:500;line-height:1.3;font-size:28px}
#text p{margin:0 0 14px}
#text .int{color:var(--muted)}
#hint{color:var(--muted);font-size:.7em}
footer{background:var(--bar);padding:10px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
#lvl{height:6px;width:40px;border-radius:3px;background:var(--lvl);transition:width .1s;opacity:.25}
#mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:34px;padding:0}
#mic.on{background:var(--stop)}
.row{display:flex;gap:10px;align-items:center;width:100%;max-width:480px}
.row input{flex:1}
label{font-size:14px;white-space:nowrap}
#status{display:none;padding:10px 14px;font-size:16px;line-height:1.3;background:var(--bar);color:var(--fg);border-bottom:2px solid var(--stop)}
</style>
</head>
<body>
<header>
  <select id="lang" aria-label="Langue parlée">
    <option value="fr-FR">Français</option><option value="en-US">English (US)</option>
    <option value="en-GB">English (UK)</option><option value="es-ES">Español</option>
    <option value="de-DE">Deutsch</option><option value="it-IT">Italiano</option>
    <option value="pt-PT">Português</option><option value="ar-SA">العربية</option>
  </select>
  <button id="hc" aria-label="Contraste élevé">◐</button>
  <button id="copy" aria-label="Copier">⧉</button>
  <button id="clear" aria-label="Effacer">✕</button>
</header>
<div id="status" role="status"></div>
<main id="text" aria-live="polite"><p id="hint">Appuie sur le micro pour afficher en direct ce qui se dit autour de toi.</p></main>
<footer>
  <div id="lvl"></div>
  <button id="mic" aria-label="Démarrer la transcription">🎤</button>
  <div class="row"><label for="size">Taille</label><input id="size" type="range" min="18" max="64" step="2" value="28"></div>
</footer>
<script>
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const box=$('text'),mic=$('mic');
let rec=null,listening=false,lines=[],committed=0,interim='',wake=null,audio=null,raf=0;

function status(m){const s=$('status');s.textContent=m;s.style.display=m?'block':'none'}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}

function render(){
  box.innerHTML='';
  if(!lines.length&&!interim){const h=document.createElement('p');h.id='hint';h.textContent='Appuie sur le micro pour afficher en direct ce qui se dit autour de toi.';box.appendChild(h);return}
  lines.forEach(l=>{const p=document.createElement('p');p.textContent=l;box.appendChild(p)});
  if(interim){const p=document.createElement('p');p.className='int';p.textContent=interim;box.appendChild(p)}
  box.scrollTop=box.scrollHeight;
}

function newRec(){
  const r=new SR();
  r.lang=$('lang').value;r.continuous=true;r.interimResults=true;
  committed=0;
  r.onresult=e=>{
    for(let i=committed;i<e.results.length;i++){
      if(e.results[i].isFinal){const t=e.results[i][0].transcript.trim();if(t)lines.push(t);committed=i+1}
    }
    interim=Array.from(e.results).slice(committed).map(x=>x[0].transcript).join(' ').trim();
    render();
  };
  r.onerror=e=>{
    if(e.error==='no-speech'||e.error==='aborted')return;
    if(e.error==='service-not-allowed'){stop();status('Erreur service-not-allowed : active Siri (Réglages > Siri) et la Dictée (Réglages > Général > Clavier), puis recharge la page.');return}
    if(e.error==='audio-capture'){stop();status('Erreur audio-capture : un autre appli utilise le micro. Ferme-la puis recharge la page.');return}
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      stop();status('Micro ou reconnaissance vocale bloqués ('+e.error+'). Ouvre la page directement dans Safari (pas dans l’app Claude), puis vérifie Réglages > Safari > Micro et la Dictée dans Réglages > Général > Clavier.');
    }else{status('Erreur : '+e.error)}
  };
  r.onend=()=>{
    if(interim){lines.push(interim);interim=''}
    render();
    if(listening){setTimeout(()=>{if(listening){rec=newRec();try{rec.start()}catch(e){}}},150)}
  };
  return r;
}

async function meter(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const an=ctx.createAnalyser();an.fftSize=512;ctx.createMediaStreamSource(s).connect(an);
    audio={s,ctx};const d=new Uint8Array(an.fftSize);
    const loop=()=>{an.getByteTimeDomainData(d);let m=0;for(const v of d)m=Math.max(m,Math.abs(v-128));
      const l=$('lvl');l.style.width=(40+Math.min(m/64,1)*240)+'px';l.style.opacity=listening?1:.25;raf=requestAnimationFrame(loop)};
    loop();
  }catch(e){}
}

async function start(){
  if(!SR){status('La reconnaissance vocale n’est pas disponible ici. Ouvre cette page directement dans Safari.');return}
  status('');
  listening=true;mic.classList.add('on');mic.textContent='■';mic.setAttribute('aria-label','Arrêter la transcription');
  rec=newRec();try{rec.start();status('Écoute en cours… parle près du micro.')}catch(e){status('Impossible de démarrer : '+e.message)}
  try{wake=await navigator.wakeLock.request('screen')}catch(e){}
}
function stop(){
  listening=false;mic.classList.remove('on');mic.textContent='🎤';mic.setAttribute('aria-label','Démarrer la transcription');
  try{rec&&rec.stop()}catch(e){}
  try{wake&&wake.release()}catch(e){}
  cancelAnimationFrame(raf);
  if(audio){audio.s.getTracks().forEach(t=>t.stop());try{audio.ctx.close()}catch(e){}audio=null}
  $('lvl').style.width='40px';$('lvl').style.opacity=.25;
}

mic.onclick=()=>{if(navigator.vibrate)navigator.vibrate(20);listening?stop():start()};
$('clear').onclick=()=>{lines=[];interim='';render()};
$('copy').onclick=async()=>{
  const t=lines.concat(interim?[interim]:[]).join('\n');if(!t)return;
  try{if(navigator.share){await navigator.share({text:t})}else{await navigator.clipboard.writeText(t)}}catch(e){}
};
$('size').oninput=e=>{box.style.fontSize=e.target.value+'px';store('size',e.target.value)};
$('hc').onclick=()=>{document.body.classList.toggle('hc');store('hc',document.body.classList.contains('hc')?'1':'0')};
$('lang').onchange=e=>{store('lang',e.target.value);if(listening){stop();start()}};

$('size').value=load('size','28');box.style.fontSize=$('size').value+'px';
if(load('hc','0')==='1')document.body.classList.add('hc');
$('lang').value=load('lang','fr-FR');
</script>
</body>
</html>
